name: v8 feature or documentation request
description: Describe a DSH workspace problem, desired outcome, or failing documentation steps.
labels: ['version:v8']
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options: [Feature request, Documentation issue]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Use case and problem
      description: For documentation problems, include the path, version, and failing steps.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome and impact
      description: Explain any compatibility, data migration, or cost implications.
    validations:
      required: true
