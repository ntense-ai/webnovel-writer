name: Feature request
description: Suggest a capability, workflow improvement, template, or integration.
title: "【Feature】"
labels: ["enhancement"]
body:
  - type: dropdown
    id: product_line
    attributes:
      label: Product line
      options:
        - v6（Claude Code / master）
        - v8（DSH Scriptor / v8）
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Describe the writing-workflow problem first, then how the system should address it.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Does the problem concern writing, planning, review, memory, RAG, or Dashboard?
      placeholder: "Example: Before planning the next volume, it is difficult to prioritize unresolved foreshadowing across a long serial."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Desired solution
      description: What should Webnovel Writer do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Target module
      description: Select the module primarily affected.
      multiple: true
      options:
        - Initialization workflow
        - Planning workflow
        - Chapter-writing workflow
        - Review workflow
        - Queries / memory
        - Story System / data pipeline
        - RAG / reference search
        - Dashboard
        - Genre templates
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model used
      description: If this concerns model performance, name the model; otherwise write Not applicable.
      placeholder: "Example: deepseek-v4-pro / gpt-5.5 / claude-opus-4-8 / claude-sonnet-4-6 / gemini-3.1-pro-preview / gemini-3.5-flash / Not applicable"
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example workflow
      description: Describe how an author would use this feature.
      placeholder: |
        1. The user runs ...
        2. The system shows ...
        3. The user confirms ...
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What alternatives, manual workarounds, or smaller implementations have you considered?
  - type: textarea
    id: impact
    attributes:
      label: Impact and risks
      description: Describe implications for compatibility, data migration, privacy, prompt behavior, or maintenance.
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and confirmed this suggestion is not a duplicate.
          required: true
        - label: I described an author workflow or writing problem, not just implementation details.
          required: true
        - label: I considered whether this belongs in documentation, templates, prompts, scripts, or Dashboard.
          required: true
