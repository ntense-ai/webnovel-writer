name: Documentation or template suggestion
description: Suggest improvements to documentation, genre templates, references, examples, or onboarding.
title: "【Docs/Templates】"
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        First identify unclear, missing, or outdated material, then describe the desired improvement. Use only short, redacted examples.
  - type: textarea
    id: target
    attributes:
      label: What needs changing?
      description: Which document, template, genre profile, reference, or onboarding step needs adjustment?
      placeholder: "Example: docs/guides/genres.md needs guidance for combining fantasy and rules horror."
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: Current problem
      description: What is confusing, missing, outdated, or difficult to use?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: Describe the explanation, example, template field, or reference rule you would add.
    validations:
      required: true
  - type: dropdown
    id: audience
    attributes:
      label: Primary audience
      description: Who would benefit most?
      options:
        - New users
        - Plugin maintainers
        - Genre / template contributors
        - Dashboard users
        - Advanced CLI users
        - Other
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model used
      description: If this concerns model output, prompts, or agent behavior, name the model; otherwise write Not applicable.
      placeholder: "Example: deepseek-v4-pro / gpt-5.5 / claude-opus-4-8 / claude-sonnet-4-6 / gemini-3.1-pro-preview / gemini-3.5-flash / Not applicable"
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I reviewed the existing documentation and templates.
          required: true
        - label: I included no private manuscript content, except short redacted excerpts when necessary.
          required: true
