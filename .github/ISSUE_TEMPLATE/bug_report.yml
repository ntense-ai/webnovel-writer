name: Bug report
description: Report reproducible problems in commands, agents, the data pipeline, or Dashboard.
title: "【Bug】"
labels: ["bug"]
body:
  - type: dropdown
    id: product_line
    attributes:
      label: Product line
      options:
        - v6（Claude Code / master）
        - v8（DSH Scriptor / v8）
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Thank you for improving Webnovel Writer. Include reproducible details and redact manuscript text, API keys, and personal data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe what happened.
      placeholder: "Example: after /webnovel-write 12, review-pipeline passes but no CHAPTER_COMMIT is generated."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Select the affected module.
      multiple: true
      options:
        - Claude Code skill commands
        - Python CLI
        - Story System / CHAPTER_COMMIT
        - RAG / reference search
        - Dashboard
        - Agent prompts / workflows
        - Templates / genre profiles
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Triggering command or entry point
      description: Which command triggered the problem?
      placeholder: "/webnovel-write 12 or python -X utf8 ... webnovel.py preflight"
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide minimal, reliable reproduction steps.
      placeholder: |
        1. Install the plugin using ...
        2. Run ... in project ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened? Include relevant error or log excerpts.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include version and platform information.
      value: |
        - Operating system:
        - Python version:
        - Claude Code version:
        - Plugin version:
        - Installation scope:user / project
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model used
      description: Enter the model used when the problem occurred; write Unknown if unsure.
      placeholder: "Example: deepseek-v4-pro / gpt-5.5 / claude-opus-4-8 / claude-sonnet-4-6 / gemini-3.1-pro-preview / gemini-3.5-flash"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Include relevant preflight/status output. Redact API keys, private manuscript text, and personal information.
      placeholder: |
        python -X utf8 "<CLAUDE_PLUGIN_ROOT>/scripts/webnovel.py" --project-root "<PROJECT_ROOT>" preflight --format json
  - type: textarea
    id: files
    attributes:
      label: Related files or state
      description: List relevant files, commit artifacts, screenshots, or Dashboard pages. Avoid sharing full private chapters.
      placeholder: ".story-system/commits/chapter_012.commit.json, .webnovel/state.json, Dashboard > System"
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and confirmed this is not a duplicate.
          required: true
        - label: I removed or redacted API keys, private manuscript content, and personal information.
          required: true
        - label: I provided enough information to reproduce or diagnose the problem.
          required: true
