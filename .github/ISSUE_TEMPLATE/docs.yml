name: Documentation issue
description: Report errors in installation guides, command references, or tutorials.
title: '[Docs] '
labels: [documentation]
body:
  - type: dropdown
    id: product_line
    attributes:
      label: Product line
      options:
        - v6（Claude Code / master）
        - v8（DSH Scriptor / v8）
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Documentation link, version, and failing steps
      description: Describe expected and actual results without sharing keys or private work.
    validations:
      required: true
