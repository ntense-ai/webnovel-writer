name: v8 DSH workspace bug
description: DSH Scriptor installation, book workspace, writing workflow, or interface problems.
title: '[v8 Bug] '
labels: [bug, 'version:v8']
body:
  - type: input
    id: version
    attributes:
      label: Exact workspace version
      placeholder: 0.1.0-preview.3
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and installation method
      value: |
        OS：
        Node：
        DSH：
        Package version or source commit:
        Optional provider version, if applicable:
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction, expected behavior, and actual behavior
      description: Use synthetic material; do not upload original books, complete conversations, or configuration exports.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model provider and identifier (Not applicable if unrelated)
  - type: textarea
    id: logs
    attributes:
      label: Redacted error excerpt or screenshot
      description: Remove API keys, launch tokens, user paths, and private manuscript text.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I checked for duplicates and removed secrets and private work.
          required: true
